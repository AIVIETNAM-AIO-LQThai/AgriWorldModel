generated_flags:
  table5_consistency:
    record_id: flag-table5-markers-inconsistent-with-n72
    flag_type: reported_inconsistency
    locator: Table 5 (caption and annotations)
    detail_template: 'Treating the n = {n} stated in the Table 5 caption as {n} independent pairs, a two-sided Pearson test implies p < 0.05 for |r| >= {c05} and p < 0.01 for |r| >= {c01}. Reading ''*'' as 0.01 <= p < 0.05, ''**'' as p < 0.01 and no mark as p >= 0.05, {n_inconsistent} of {n_total} printed annotations disagree: {n_missing} correlations carry no star although |r| >= {c05} (a disagreement under any reading of the stars) and {n_single_star} carry a single star although |r| >= {c01}. Under an inclusive reading of ''*'' (p < 0.05 even when p is smaller) only the {n_missing} unmarked cells disagree. The printed r values and stars are preserved unchanged. This does not show that the authors'' tests were wrong: the pooled observations are probably not {n} independent pairs, and the number of observations behind each leaf and fruit variable is not stated. The related records are the correlations whose printed annotation disagrees with the independent-pairs check.'
  table5_pooling:
    record_id: flag-table5-pooled-observations
    flag_type: not_causally_identified
    locator: Table 5; Section 4.4
    detail: 'Table 5 correlations pool observations across treatments, sites and seasons (n = 72 is the stated total; the soil samples are 4 treatments x 3 replicates x 3 sites x 2 seasons). They are descriptive associations of pooled values: treatment arms, orchards and seasons are mixed, observations from the same orchard, season or replicate are probably not independent, and soil and leaf values were measured after treatment. They are not intervention effects and not evidence that changing one soil or leaf variable would change the PD rate. The paper does not state the unit behind each observation for leaf and fruit variables.'
  letter_semantics:
    record_id: flag-comparison-letter-semantics-ambiguous
    flag_type: other
    locator: Table 1-4 footnotes; Section 4.6
    detail: Section 4.6 states that Duncan's post hoc test (p < 0.05) was used to identify differences among treatments. The table footnotes say 'Different letters indicate significance at p < 0.05 (*), p < 0.01 (**), and p < 0.001 (***)' (Table 1; the other tables list the levels they use), which ties letters to the asterisk levels printed in each table's p-value row without naming the omnibus test behind that row. The compiled families keep the printed letters and the printed marker separately, attribute the letters to the Duncan procedure at alpha 0.05 as stated in Section 4.6, and do not infer the omnibus test.
