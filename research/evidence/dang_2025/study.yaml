flags:
- record_id: flag-ff-dose-missing
  flag_type: missing_dose_information
  detail: The article identifies TANO 708, its reported K2O/Ca composition, and the three application times, but the applied spray dose or concentration is not stated in Sections 4.2-4.3.
  related_record_ids:
  - int-ff
  locator: Sections 4.2 and 4.3
- record_id: flag-table2-d1-om-k-sd
  flag_type: reported_inconsistency
  detail: Table 2 reports the D1, 2022-2023, OM leaf-K cell as '13.9 b ± 035'. The decimal point in the reported SD is ambiguous, so dispersion_value is left unresolved rather than silently corrected.
  related_record_ids:
  - t2-d1-2022-2023-om-k
  locator: Table 2, D1, 2022-2023, OM, K
- record_id: flag-table4-d2-control-bstar-sd
  flag_type: other
  detail: Table 4 reports the D2, 2023-2024 Control b* value as 37.3 c ± 11.8. The SD is unusually large relative to neighboring cells. It is preserved exactly as published and not corrected.
  related_record_ids:
  - t4-d2-2023-2024-control-bstar
  locator: Table 4, D2, 2023-2024, Control, b*
- record_id: flag-randomization-unit-unclear
  flag_type: randomization_unit_unclear
  detail: The article reports a randomized complete block design with three replicates and 12 trees per treatment, but does not explicitly identify the physical randomization unit. The compiler therefore does not infer tree, plot, or replicate as the randomization unit. Every derived treatment-minus-control difference is therefore a descriptive difference of published arm means; the unit of inference and the independence of replicates are unknown.
  related_record_ids: []
  locator: Section 4.3 Experimental Design
- record_id: flag-pd-post-treatment-selection
  flag_type: post_treatment_selection
  detail: Fruit-quality outcomes (PD rate, peel/seed/aril proportions, aril b* and TSS) were measured on three randomly selected fruits per replicate, restricted to 2.2-2.8 kg and no physical pest damage. Because this selection happens after treatment, these outcomes describe sound fruit in that weight range and are narrower than orchard-wide fruit-level outcomes. Fruit yield (all fruit weighed), soil and leaf outcomes are not subject to this rule.
  related_record_ids:
  - outcome-aril-b-star
  - outcome-aril-proportion
  - outcome-pd-rate
  - outcome-peel-proportion
  - outcome-seed-proportion
  - outcome-tss
  locator: Section 4.5 Evaluation of Fruit Yield and Quality Characteristics
