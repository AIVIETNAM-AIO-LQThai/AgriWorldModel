contrast_rules:
  effect_type: absolute_mean_difference
  evidential_basis: published_arm_mean_difference
  estimand_text: Difference between the published arm means of one treatment arm and the control arm (each a mean over three replicates) within one orchard, season and outcome stratum. A descriptive comparison of reported summaries, not an estimated treatment effect.
  uncertainty_status: not_reconstructible_from_published_summaries
  uncertainty_text: The paper reports arm means and standard deviations (n = 3) but not the replicate-level data, block structure or randomization unit that an estimate of the standard error or confidence interval of this pairwise difference would need; none is inferred.
  significance_text: null
  assumptions:
  - The two values are published arm means from one orchard and season, each over three replicates.
  - The stored value is a deterministic difference of published means. It is not a block-adjusted, model-based or causal effect estimate, and the paper reports no pairwise test for this comparison.
  - The physical randomization unit is not reported, so the unit of inference and the independence of replicates are unknown.
  - No standard error, confidence interval or p-value is derived.
  provenance_notes: Deterministic difference between published treatment and control arm means. No uncertainty or p-value is inferred.
  difference_units:
    '%': percentage points
  selected_fruit_assumption: The outcome was measured only on selected fruit (see the outcome's sampling and selection rules), so the difference applies to that selection, not to all fruit.
family_rules:
  overall_test_method_status: not_reported
  post_hoc_method: Duncan post hoc test
  post_hoc_alpha: 0.05
  group_letter_semantics: Different letters indicate a significant difference between treatment means under the Duncan post hoc procedure at p < 0.05, as stated in Section 4.6; the footnote wording is ambiguous (see flag-comparison-letter-semantics-ambiguous).
  method_locator: Section 4.6 Data Analysis
  result_locator_suffix: treatment letters and p-value row
  no_letters_semantics: The paper prints no group letters for this family, whose reported family marker is ns (not significant); no pairwise grouping is available.
association_rules:
  statistic: pearson_r
  sample_size: 72
  scope: pooled study observations
  significance_text:
    '*': p < 0.05
    '**': p < 0.01
  variables:
    soil_ph: outcome-soil-ph
    soc: outcome-soc
    available_p: outcome-available-p
    exchangeable_k: outcome-soil-exchangeable-k
    exchangeable_ca: outcome-soil-exchangeable-ca
    leaf_k: outcome-leaf-k
    leaf_ca: outcome-leaf-ca
    fruit_yield: outcome-fruit-yield
    pd_rate: outcome-pd-rate
